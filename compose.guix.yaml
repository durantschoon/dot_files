name: dotfiles-guix
services:
  guix:
    platform: linux/amd64
    image: metacall/guix@sha256:e028ebad915a2ff1e4b91680444600dd6712214cf2c7cb0bcb6ebd5fe8891afe
    container_name: guix-dev
    restart: unless-stopped
    # Both the base image and Guix's glibc-utf8-locales supply this locale.
    # setup-guix-container installs the latter into the persistent profile.
    environment:
      LANG: C.utf8
      LC_ALL: C.utf8
      # This container's own name, for .jobs.zsh. JOB_HOSTS holds the homebase
      # as `ctr:guix-dev', and a shell inside the container must recognise that
      # entry as ITSELF -- there is no way to learn one's container name from
      # inside ($HOSTNAME is the container id). Must match container_name.
      JOB_CONTAINER_SELF: guix-dev
      GUIX_LOCPATH: /root/.guix-profile/lib/locale
      XDG_RUNTIME_DIR: /tmp/xdg-runtime-root
      # The Mac's gpg-agent, via the loopback socat LaunchAgent that
      # `make setup-gpg-bridge' installs.  Port must match GPG_BRIDGE_PORT.
      GPG_AGENT_BRIDGE: host.docker.internal:45123
      # git signs through a wrapper that warns when the passphrase must be
      # entered on the Mac's own screen.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: gpg.program
      GIT_CONFIG_VALUE_0: /root/dot_files/build-aux/guix-container-gpg
    # Guix sets personality when spawning builders. Docker's default filter
    # rejects it even when a profile only links packages already in the store.
    security_opt:
      - seccomp=unconfined
    working_dir: /root/dot_files
    entrypoint: ["/bin/bash", "/root/dot_files/build-aux/guix-container-daemon.sh"]
    volumes:
      - guix-store:/gnu/store
      - guix-var:/var/guix
      - guix-home:/root
      - .:/root/dot_files
      - ~/Repos:/root/Repos
      - ~/lim_docs:/root/lim_docs
volumes:
  guix-store:
    external: true
    name: guix-actions-store
  guix-var:
    external: true
    name: guix-actions-var
  guix-home:
    external: true
    name: guix-dev-home
