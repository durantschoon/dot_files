# ================================================================
# TMUX CONFIGURATION FOR EMACS USERS: SET PREFIX TO CTRL+PIPE
# ================================================================

# reload with
# tmux source-file ~/.tmux.conf

# Unbind the default Ctrl+b prefix
unbind C-b

# Ctrl+pipe is Ctrl+Shift+backslash on a US keyboard.
set-option -g prefix 'C-|'

# Give tmux time to receive the key after the prefix.
# This was 0 in the live server, which can make `prefix` then `[` look like plain `[`.
set-option -g prefix-timeout 1000

# Traditional terminal input encodes Ctrl+pipe as ASCII 0x1c, which tmux
# reads as Ctrl+backslash. C-4 is a distinct binding in newer tmux versions.
set-option -g prefix2 C-\\

# Be explicit: when Ctrl+pipe arrives at the tmux client, enter tmux's prefix table.
# This is redundant with `prefix`, but helps through nested terminal/mux stacks.
bind-key -n 'C-|' switch-client -T prefix
bind-key -n C-\\ switch-client -T prefix
# Extended keyboard protocols may retain Shift in the reported key.
bind-key -n 'C-S-|' switch-client -T prefix
bind-key -n C-S-\\ switch-client -T prefix
bind-key -n C-4 switch-client -T prefix

# Allow hitting the prefix twice to pass the keystroke through to underlying apps.
bind-key 'C-|' send-prefix
bind-key C-\\ send-prefix -2
bind-key 'C-S-|' send-prefix
bind-key C-S-\\ send-prefix
bind-key C-4 send-prefix

# Scrollback / copy-mode.
# Normal tmux is: Ctrl+Shift+backslash, release all modifiers, then press [.
# These extra bindings also work if Ctrl is still held and [ arrives as Ctrl-[/Escape.
bind-key [ copy-mode
bind-key C-[ copy-mode
bind-key Escape copy-mode
