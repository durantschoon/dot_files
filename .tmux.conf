# ================================================================
# TMUX CONFIGURATION FOR EMACS USERS: SET PREFIX TO CTRL+BACKSLASH
# ================================================================

# reload with
# tmux source-file ~/.tmux.conf

# Unbind the default Ctrl+b prefix
unbind C-b

# Set the new global prefix to Ctrl+backslash.
# In tmux config syntax, the backslash key must be escaped as C-\\.
set-option -g prefix C-\\

# Give tmux time to receive the key after the prefix.
# This was 0 in the live server, which can make `prefix` then `[` look like plain `[`.
set-option -g prefix-timeout 1000

# Some terminal stacks report Ctrl+backslash as Ctrl+4 (both are ASCII 0x1c).
# Accept it as a second spelling of the same prefix.
set-option -g prefix2 C-4

# Be explicit: when Ctrl+backslash arrives at the tmux client, enter tmux's prefix table.
# This is redundant with `prefix`, but helps through nested terminal/mux stacks.
bind-key -n C-\\ switch-client -T prefix
bind-key -n C-4 switch-client -T prefix

# Allow hitting Ctrl+backslash twice to pass the keystroke through to underlying apps.
bind-key C-\\ send-prefix
bind-key C-4 send-prefix

# Scrollback / copy-mode.
# Normal tmux is: Ctrl+backslash, release Ctrl, then press [.
# These extra bindings also work if Ctrl is still held and [ arrives as Ctrl-[/Escape.
bind-key [ copy-mode
bind-key C-[ copy-mode
bind-key Escape copy-mode
