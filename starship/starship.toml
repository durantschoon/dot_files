# Starship prompt config.  Deployed to ~/.config/starship.toml by
# home/common.scm (home-files-service-type) on Linux, by `make set_up_links' on macOS.
#
# Why this file exists: Starship's default symbols for some modules are colour
# emoji above U+FFFF (package 📦 U+1F4E6, python 🐍 U+1F40D).  ConEmu cannot
# draw characters outside the Basic Multilingual Plane, so they render as �
# regardless of font.  These overrides use Nerd Font glyphs in the BMP
# private-use area, which CaskaydiaCove NF draws everywhere.
#
# Written as \u escapes so an editor or paste can't mangle them.  Adding a
# language?  Check its default symbol's codepoint first:
#   printf '%s' '🦀' | iconv -t UTF-32BE | xxd    # > 0000ffff => override it
# Avoid nf-md-* glyphs (U+F0001 and up): they are outside the BMP too.

# Scan timeout: milliseconds starship spends scanning files in the current
# directory (default: 30ms). On WSL, filesystem latency (e.g. across 9p/drvfs
# mounts or when starting a login shell before cache is warm) routinely exceeds
# 30ms, triggering:
#   "[WARN] - (starship::context): Scanning current directory timed out."
#   "[WARN] - (starship::context): You can set scan_timeout in your config to a higher value..."
scan_timeout = 1000

# Command timeout: milliseconds starship waits for external commands to finish
# (default: 500ms). Increased to prevent timeouts under WSL filesystem latency.
command_timeout = 1000

# Right-hand prompt: whether this shell is inside a `guix shell' environment
# (guix_shell keys off $GUIX_ENVIRONMENT; nothing is shown outside one), which
# machine, the history event number to recall with !N, and the time and date
# (the old zsh RPROMPT's "[%h]" and "[%* on %D]").  Modules named in
# right_format drop out of $all, so the left prompt no longer repeats them.
right_format = "$guix_shell$hostname ${env_var.STARSHIP_HISTNO}$time"

[package]
symbol = " "   # nf-oct-package

[python]
symbol = " "   # nf-dev-python

# Colours: the defaults for hostname ("bold dimmed green") and java ("red
# dimmed") are unreadable on a dark background; "dimmed" is the culprit.

[hostname]
ssh_only = false
format = "[$ssh_symbol$hostname]($style)"   # default adds "in ", pointless on the right
style = "bold bright-green"

[java]
style = "bold bright-red"

# History event number (zsh's %h), exported by a precmd hook in .zshrc.starship;
# starship runs as a child process and cannot read the shell's history itself.
[env_var.STARSHIP_HISTNO]
format = "[\\[$env_value\\]]($style) "
style = "bold bright-blue"

[time]
disabled = false
time_format = "%H:%M:%S on %y-%m-%d"
format = "[\\[$time\\]]($style)"
style = "bold yellow"

[guix_shell]
symbol = "\uf325 "   # nf-linux-gnu_guix; default 🐃 is U+1F403, outside the BMP
format = "[$symbol]($style)"
