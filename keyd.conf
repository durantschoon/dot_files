[ids]
*

[main]
# Swap CapsLock and Control.
# "capslock = control" is NOT valid keyd -- keyd 2.6 rejects the line
# ("invalid key or action") and skips it, which is how Control got lost
# entirely: the reverse line below still applied.  layer(control)
# activates the built-in control modifier layer, so held CapsLock is
# a real Control.
capslock = layer(control)
leftcontrol = capslock

# NO [control:C] Emacs layer here, deliberately.
#
# There used to be one (n/p/f/b -> arrows, a/e -> home/end, h -> backspace,
# d -> delete, k -> S-end).  It has to go, because keyd rewrites keys at the
# evdev level -- below the compositor, below the terminal, below Emacs.  A
# C-f consumed here is not "C-f plus a helpful default"; the control
# character never exists, and nothing downstream can get it back:
#
#   C-a  ->  Home       zsh has no binding for the Home sequence, so the
#                       terminal rings the bell (the "blink")
#   C-f  ->  Right      C-x C-f can never complete, because the second half
#                       of the chord arrives as an arrow keypress
#   C-h  ->  Backspace  Emacs help prefix, gone
#   C-d  ->  Delete     delete-char / EOF, gone
#   C-k  ->  S-end      kill-line becomes select-to-end-of-line
#
# The layer was also redundant.  Emacs and readline implement every one of
# those bindings natively, and GTK applications get them from the
# gtk-key-theme=Emacs setting that emacs-keybindings-activation applies in
# home/base.scm and home/wayland.scm.  The layer only ever displaced working
# bindings with lossy approximations.
#
# Keep this file to the Caps/Control swap.  If some specific non-GTK
# application needs Emacs motion keys, fix it in that application.
