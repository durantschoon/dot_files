# espanso configuration file

# For a complete introduction, visit the official docs at: https://espanso.org/docs/

# You can use this file to define the global configuration options for espanso.
# These are the parameters that will be used by default on every application,
# but you can also override them on a per-application basis.

# To make customization easier, this file contains some of the commonly used
# parameters. Feel free to uncomment and tune them to fit your needs!

# --- Keyboard layout

# Espanso cannot work this out on its own here and says so on every start:
#   "unable to determine keyboard layout automatically, please explicitly
#    specify it in the configuration"
# It needs the layout to map evdev scancodes to characters, so without it the
# detection side is guessing. "us" matches the system keyboard-layout declared
# in system/geeeks.scm.
#
# Note the CapsLock/Control swap does NOT belong here: that arrives from keyd
# and from the ctrl:swapcaps X keyboard option, both below this layer.
keyboard_layout:
  layout: "us"

# --- Notifications

show_notifications: false

# --- Toggle key

# Customize the key used to disable and enable espanso (when double tapped)
# Available options: CTRL, SHIFT, ALT, CMD, OFF
# You can also specify the key variant, such as LEFT_CTRL, RIGHT_SHIFT, etc...
# toggle_key: ALT
# You can also disable the toggle key completely with
toggle_key: OFF

# --- Injection Backend

# Espanso supports multiple ways of injecting text into applications. Each of
# them has its quirks, therefore you may want to change it if you are having problems.
# By default, espanso uses the "Auto" backend which should work well in most cases,
# but you may want to try the "Clipboard" or "Inject" backend in case of issues.
# backend: Clipboard
#
# NOTE: the `backend' key is deliberately NOT set in this file.  When guix
# home deploys it, home/wayland.scm APPENDS the key, derived from the
# %session record there: on compositors without the wlr-data-control protocol
# (GNOME's Mutter), espanso's Auto backend silently pastes stale clipboard
# contents instead of the expansion -- observed on this machine -- so Inject
# is forced; on compositors that implement the protocol, Auto is restored.
# The full reasoning lives with %espanso-default-yml in home/wayland.scm,
# next to the fact that decides it.
#
# If you ever consume this file OUTSIDE guix home, add the key by hand:
# `backend: Inject' is the safe choice on GNOME Wayland.  After any backend
# change, test the Unicode expansions (raxx, laxx, degxx, chxx, e2oxx) --
# Inject types through the EVDEV virtual keyboard, which is layout-sensitive
# where the clipboard route is not.

# --- Auto-restart

# Enable/disable the config auto-reload after a file change is detected.
# auto_restart: false

# --- Clipboard threshold

# Because injecting long texts char-by-char is a slow operation, espanso automatically
# uses the clipboard if the text is longer than 'clipboard_threshold' characters.
# clipboard_threshold: 100

# For a list of all the available options, visit the official docs at: https://espanso.org/docs/