  - trigger: "pkxx"
    replace: "Personal Knowledge"
  - trigger: "pkmxx"
    replace: "Personal Knowledge Management"
  # The zsh global alias for 2>&1, defined in .aliases -- merges stderr into
  # stdout.  It has to be typed with the real arrow: `err->out' parses as a
  # redirection and `err-\>out' is a quoted word, which zsh will not
  # alias-expand.  Hence this expansion.
  #
  # For a bare arrow use the existing raxx / laxx pair above, not a third
  # trigger for the same character.
  - trigger: "e2oxx"
    replace: "err→out"
