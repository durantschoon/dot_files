# Herdr config. Source of truth is ~/dot_files/herdr/config.toml; `make
# set_up_links` symlinks it to ~/.config/herdr/config.toml and, on macOS,
# to ~/Library/Application Support/herdr/config.toml (the path Herdr reads).
#
# reload with
# herdr server reload-config

onboarding = false

[keys]
# Keep Herdr's own prefix off Ctrl+backslash so tmux can use it.
prefix = "f12"

# Direct Herdr tab switching. iTerm must pass Option-arrow through as alt+left/right.
previous_tab = "alt+left"
next_tab = "alt+right"

# Move the active selection in the left workspace sidebar.
previous_workspace = "alt+up"
next_workspace = "alt+down"

# Sidebar rows for each workspace. `$note` is the notes headline pushed by
# `herdr-notes-sync` (~/dot_files/.jobs.zsh); job-note refreshes it on save.
[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"], [{ token = "$note", dim = true }]]

# Toast notifications
[ui.toast]
delivery = "system"       # desktop notification; "herdr" for an in-app toast, "terminal" for the terminal
delay_seconds = 1

[ui.toast.herdr]
position = "top-left"

[ui.sound]
enabled = false

# Shell for new panes.  Empty means $SHELL, then /bin/sh -- and panes opened
# through the API (agent-herdr's `herdr tab create`) got /bin/sh (dash in
# orb-guix), leaving a bare `#` prompt once the agent exits.  A bare name so
# the same file works on macOS (/bin/zsh) and in Guix (profile zsh).
[terminal]
default_shell = "zsh"
