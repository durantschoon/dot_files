# ~/.gnupg/gpg.conf -- the gpg CLI's own options, the same on every machine.
# Deployed by `make install-gnupg' as a symlink; see docs/GPG.md.
#
# The agent side (pinentry, cache TTLs) is NOT here: on Linux guix home
# writes ~/.gnupg/gpg-agent.conf from the gpg-ssh-agent layer in
# home/common.scm, and on macOS `make install-gnupg' renders it from
# gnupg/gpg-agent.mac.conf.

# The key git signs with (user.signingkey in .gitconfig is the long id of
# this same key).  Full fingerprint so a look-alike short id can never match.
default-key 7CE816967443FCECCE0BF1B76A2DAE7008D4F938

# Fetch a missing public key from the keyserver in dirmngr.conf when
# verifying a signature, instead of failing with "No public key".
auto-key-retrieve

# Do not stamp the GnuPG version into armored output.
no-emit-version

# Long key ids everywhere: 8-hex short ids are trivially collidable.
keyid-format 0xlong
with-fingerprint
