# ~/.gnupg/gpg-agent.conf for macOS -- rendered (not symlinked) by
# `make install-gnupg', which replaces @DOTFILES@ with the repo's path.
#
# Linux does not use this file: there guix home generates gpg-agent.conf
# from the gpg-ssh-agent layer in home/common.scm, and the TTLs below are
# kept equal to that layer's so a passphrase lasts the same on every machine.

# bin/pinentry-auto runs pinentry-mac (brew install pinentry-mac), the native
# window, unless the requesting shell is an ssh login, when it runs
# pinentry-curses in that terminal instead -- a window on the Mac's own
# screen is invisible over ssh and the commit just hangs.  Plain pinentry-mac
# here, without the wrapper, is fine for a Mac nobody ever sshes into.
pinentry-program @DOTFILES@/bin/pinentry-auto

# Passphrase cache: 16 h since last use, 24 h hard cap.  Long enough that an
# unattended job (claude-run, tmux-run) started after one unlock can keep
# signing commits through a full waking day.
default-cache-ttl 57600
max-cache-ttl 86400

# gpg-agent also serves ssh keys (ssh-add imports them into
# ~/.gnupg/sshcontrol); point SSH_AUTH_SOCK at
# `gpgconf --list-dirs agent-ssh-socket' to use it.
enable-ssh-support
default-cache-ttl-ssh 57600
max-cache-ttl-ssh 86400
