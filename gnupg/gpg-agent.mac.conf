# ~/.gnupg/gpg-agent.conf for macOS -- rendered (not symlinked) by
# `make install-gnupg', which replaces @BREW_PREFIX@ with `brew --prefix'
# (/opt/homebrew on Apple silicon, /usr/local on Intel).
#
# Linux does not use this file: there guix home generates gpg-agent.conf
# from the gpg-ssh-agent layer in home/common.scm, and the TTLs below are
# kept equal to that layer's so a passphrase lasts the same on every machine.

# The native macOS prompt (brew install pinentry-mac).  Without it gpg falls
# back to the curses pinentry, which needs a real terminal: a `git commit'
# from Emacs, a GUI git client or a background job then fails with
# "gpg: signing failed: Timeout" or "No pinentry".
pinentry-program @BREW_PREFIX@/bin/pinentry-mac

# Passphrase cache: 8 h since last use, 24 h hard cap.  Long enough that an
# unattended job (claude-run, tmux-run) started after one unlock can keep
# signing commits through a working day.
default-cache-ttl 28800
max-cache-ttl 86400

# gpg-agent also serves ssh keys (ssh-add imports them into
# ~/.gnupg/sshcontrol); point SSH_AUTH_SOCK at
# `gpgconf --list-dirs agent-ssh-socket' to use it.
enable-ssh-support
default-cache-ttl-ssh 3600
max-cache-ttl-ssh 28800
